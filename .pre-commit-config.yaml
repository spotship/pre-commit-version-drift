default_stages: [pre-commit]

default_language_version:
  python: python3.12

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: check-merge-conflict
      - id: debug-statements
      - id: check-builtin-literals
      - id: check-case-conflict
      - id: check-docstring-first
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  # This repo's own hook cannot be listed by URL here -- pre-commit would clone
  # a published rev rather than the working tree, so the check would lag the
  # code it is meant to gate. CI runs `pre-commit try-repo .` instead, which
  # builds the hook from HEAD.

# No `ci:` block here on purpose. That key configures pre-commit.ci, which is not
# installed on this repo -- the app has opened no PR and pushed no commit in this
# org at all, so `autoupdate_schedule: weekly` moved nothing and the revs above
# were frozen at whatever a human last typed. Renovate's pre-commit manager owns
# them now, and renovate.json groups the ruff rev with the ruff pin in
# pyproject.toml so both sides of the invariant this repo's own hook enforces
# move in one PR.
