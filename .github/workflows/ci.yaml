name: "ci"

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          # The source of truth, not a literal, so CI cannot drift from it.
          python-version-file: .python-version
      - name: Install pre-commit
        run: pip install pre-commit
      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The supported range, not a pin: this package runs on every version in
        # it, while .python-version says which one it is developed on. The escape
        # has to sit on the line itself -- it is matched per line, so this
        # explanation above it suppresses nothing on its own.
        python-version: ['3.11', '3.12', '3.13']  # python-version-ok: supported range
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q

  hook:
    # The unit tests import the package directly, so they pass with the console
    # script misnamed or missing. Only driving pre-commit itself catches that.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version-file: .python-version
      - run: python -m pip install --upgrade pip
      - run: python -m pip install pre-commit
      # Path 1: the packaged path -- pip install into a pre-commit venv, then
      # `entry:` resolution on that venv's PATH.
      - run: pre-commit try-repo . version-drift --all-files
      # Path 2: a genuine *separate* consumer repo, which is the only thing that
      # can catch a bad `entry:`. try-repo cannot: a `language: python` hook runs
      # with cwd = the consumer repo, and under try-repo the consumer IS this
      # repo, so a slash-bearing entry still resolves here while failing for
      # every real consumer with "Executable ... not found".
      - name: Verify a separate consumer resolves the packaged hook
        run: |
          set -euo pipefail
          hook_repo="$PWD"
          rev="$(git rev-parse HEAD)"

          # Derived from .python-version rather than hardcoded, so a version bump
          # does not need this file edited too.
          declared="$(tr -d '[:space:]' < "$hook_repo/.python-version")"
          drifted=3.9.18
          if [ "$drifted" = "$declared" ]; then
            echo "::error file=.github/workflows/ci.yaml::the drift fixture ($drifted) must differ from .python-version ($declared); pick another"
            exit 1
          fi

          consumer="$(mktemp -d)"
          cd "$consumer"
          git init -q -b main
          git config user.email ci@example.com
          git config user.name ci
          cp "$hook_repo/.python-version" .python-version
          printf 'FROM python:%s-slim\n' "$drifted" > Dockerfile
          cat > .pre-commit-config.yaml <<EOF
          repos:
            - repo: file://$hook_repo
              rev: $rev
              hooks:
                - id: version-drift
                - id: version-drift-fix
          EOF
          git add .python-version Dockerfile .pre-commit-config.yaml
          git commit -q -m init

          echo "--- 1. the check must fail on the drifted pin (want $declared, got $drifted) ---"
          out="$(pre-commit run --all-files 2>&1 || true)"
          printf '%s\n' "$out"
          if printf '%s' "$out" | grep -qF 'not found'; then
            echo "::error file=.pre-commit-hooks.yaml::entry did not resolve in a consumer repo; it must name a console script on PATH"
            exit 1
          fi
          want="Dockerfile:1: [docker-image-patch] found '$drifted', expected $declared"
          if ! printf '%s' "$out" | grep -qF "$want"; then
            echo "::error file=.pre-commit-hooks.yaml::consumer did not report the expected drift line: $want"
            exit 1
          fi

          echo '--- 2. the manual-stage --fix hook must round-trip ---'
          pre-commit run --hook-stage manual version-drift-fix --all-files && rc=0 || rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "::error file=.pre-commit-hooks.yaml::the --fix hook modified files, so it must exit non-zero"
            exit 1
          fi
          if ! grep -qF "FROM python:$declared-slim" Dockerfile; then
            echo "::error file=src/version_drift/scan.py::--fix did not rewrite the pin to $declared"
            cat Dockerfile
            exit 1
          fi

          echo '--- 3. the re-check must pass ---'
          pre-commit run version-drift --all-files

  install-floor:
    # Guards `requires-python` staying below what consumers actually run.
    # pre-commit builds the hook venv from whatever interpreter pre-commit itself
    # runs on, which in a repo with no `default_language_version` is routinely
    # older than the pinned version. Raising the floor to the pin makes
    # `pip install .` fail for every such consumer with "requires a different
    # Python". The jobs above run on the pinned version and cannot see that, so
    # this one runs the floor itself.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          # Deliberately the floor from pyproject.toml, not .python-version --
          # that is the whole point of this job, hence the escape rather than a
          # bump. tomllib is what puts the floor at 3.11.
          python-version: '3.14.8'  # python-version-ok: guards the requires-python floor
      - run: python -m pip install --upgrade pip
      - run: python -m pip install .
      - name: The console script must land on the environment's PATH
        run: |
          set -euo pipefail
          python -VV
          scripts="$(python -c 'import sysconfig; print(sysconfig.get_path("scripts"))')"
          if [ ! -x "$scripts/version-drift" ]; then
            echo "::error file=pyproject.toml::[project.scripts] did not install version-drift into $scripts"
            ls -la "$scripts"
            exit 1
          fi
          "$scripts/version-drift" --list-toolchains
