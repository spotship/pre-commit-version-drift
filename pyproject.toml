[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pre-commit-version-drift"
# A literal, bumped by hand, and the release tag is generated *from* it -- see
# CONTRIBUTING, "Cutting a release". That ordering is the point: a hand-typed tag
# beside a hand-typed version is two pins with no source of truth between them,
# which is the failure this tool exists to catch.
#
# Not setuptools-scm: pre-commit installs from a depth-1 detached checkout with
# no tags fetched, so there is no tag to derive a version from at build time.
version = "0.1.0"
description = "Fail if any pinned toolchain version disagrees with its source-of-truth file"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Spot Ship" }]
keywords = ["pre-commit", "versions", "drift", "linter"]
# tomllib, so 3.11 is a hard floor. This is the oldest version the package
# supports, which is a different fact from the one it is developed on -- see
# .python-version.
requires-python = ">=3.11"
dependencies = []

[project.urls]
Homepage = "https://github.com/spotship/pre-commit-version-drift"
Source = "https://github.com/spotship/pre-commit-version-drift"
Issues = "https://github.com/spotship/pre-commit-version-drift/issues"

[project.scripts]
version-drift = "version_drift.cli:main"

[project.optional-dependencies]
# ruff is pinned, not floating, and must equal the ruff-pre-commit rev in
# .pre-commit-config.yaml -- the invariant the ruff toolchain enforces. A
# range here resolves to whatever is newest at install time and silently
# lints differently from the hook.
dev = ["pytest>=9.1.1", "ruff==0.15.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
version_drift = ["toolchains/*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["F", "E", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Fixture data is file content: a table row that wraps is harder to read than
# one that runs long, and the wrapped form hides what is being fed to the rule.
"tests/*" = ["E501"]
